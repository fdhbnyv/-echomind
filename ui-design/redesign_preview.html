<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>声念 EchoMind · 优化版 UI 设计方案</title>
<style>
  :root {
    --bg-dark: #090D16;
    --card-dark: rgba(255, 255, 255, 0.05);
    --card-dark-border: rgba(255, 255, 255, 0.08);
    --pri-glow: #6366F1;
    --accent-cyan: #38BDF8;
    --text-main: #F1F5F9;
    --text-muted: #94A3B8;
    --text-dim: #64748B;
    --emerald: #10B981;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0D111A;
    color: #E2E8F0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px 16px 60px;
  }

  h1 { font-size: 24px; font-weight: 800; margin-bottom: 6px; color: #F8FAFC; text-align: center; }
  p.sub { font-size: 14px; color: var(--text-muted); margin-bottom: 30px; text-align: center; }

  .showcase {
    display: flex;
    gap: 30px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 1000px;
  }

  /* 手机模拟器外壳 */
  .phone {
    width: 380px;
    height: 780px;
    background: radial-gradient(circle at 50% 0%, #151F38 0%, var(--bg-dark) 60%);
    border-radius: 46px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7), 0 0 0 8px #1A202C;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }

  /* 状态栏 */
  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 24px 8px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
  }

  /* 顶栏 */
  .app-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 20px 12px;
  }
  .brand { display: flex; align-items: center; gap: 8px; }
  .logo-icon {
    width: 28px;
    height: 28px;
    background: linear-gradient(135deg, #6366F1, #38BDF8);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    box-shadow: 0 2px 10px rgba(99, 102, 241, 0.4);
  }
  .brand-title { font-size: 17px; font-weight: 800; color: #FFF; letter-spacing: -0.2px; }
  .settings-btn {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.08);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    cursor: pointer;
  }

  /* 模板切换胶囊 */
  .template-chips {
    display: flex;
    gap: 8px;
    padding: 0 20px 14px;
  }
  .chip {
    padding: 6px 13px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    display: flex;
    align-items: center;
    gap: 4px;
    cursor: pointer;
  }
  .chip.active {
    background: linear-gradient(135deg, rgba(99, 102, 241, 0.25), rgba(56, 189, 248, 0.15));
    border-color: rgba(99, 102, 241, 0.6);
    color: #FFF;
    box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2);
  }

  /* 核心主体内容区：文本输入与精致交互卡片 */
  .main-content {
    flex: 1;
    padding: 0 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    overflow-y: auto;
  }

  .editor-card {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 22px;
    padding: 16px 18px 14px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    flex: 1;
    min-height: 220px;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 12px 30px rgba(0, 0, 0, 0.25);
    backdrop-filter: blur(16px);
  }

  .editor-textarea {
    flex: 1;
    width: 100%;
    background: transparent;
    border: none;
    outline: none;
    resize: none;
    color: #F8FAFC;
    font-size: 14.5px;
    line-height: 1.6;
    font-family: inherit;
  }
  .editor-textarea::placeholder {
    color: #475569;
    font-size: 14px;
  }

  .editor-bottom {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid rgba(255, 255, 255, 0.06);
    padding-top: 10px;
  }
  .editor-tools {
    display: flex;
    gap: 12px;
    color: var(--text-dim);
    font-size: 13px;
  }
  .char-count { font-size: 11.5px; color: var(--text-dim); }

  /* 紧凑而精致的语音/整理操作栏 (平衡型紧凑 Voice Capsule) */
  .action-bar-hybrid {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .btn-mic-compact {
    flex: 1;
    height: 48px;
    background: linear-gradient(135deg, #4F46E5, #3B82F6);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    color: #FFF;
    font-size: 13.5px;
    font-weight: 600;
    border: 1px solid rgba(255, 255, 255, 0.2);
    box-shadow: 0 4px 18px rgba(79, 70, 229, 0.4);
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .btn-mic-compact:active { transform: scale(0.98); }

  .mic-wave-icon {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.2);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .btn-ai-clean {
    padding: 0 16px;
    height: 48px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 14px;
    color: #E2E8F0;
    font-size: 13px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
  }

  /* 最近速记胶囊卡片 */
  .recent-card {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 16px;
    padding: 10px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
  }
  .recent-info { display: flex; flex-direction: column; gap: 3px; }
  .recent-title { font-size: 12.5px; font-weight: 600; color: #E2E8F0; }
  .recent-time { font-size: 11px; color: var(--text-dim); }
  .badge-synced {
    font-size: 10.5px;
    padding: 3px 8px;
    border-radius: 10px;
    background: rgba(16, 185, 129, 0.15);
    color: #34D399;
    font-weight: 600;
    border: 1px solid rgba(16, 185, 129, 0.25);
  }

  /* 底部悬浮毛玻璃导航栏（保留你喜欢的导航结构） */
  .bottom-nav {
    background: rgba(9, 13, 22, 0.85);
    backdrop-filter: blur(20px);
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    padding: 8px 30px 18px;
    display: flex;
    justify-content: space-around;
    align-items: center;
  }

  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-dim);
    cursor: pointer;
    transition: color 0.2s;
  }
  .nav-item.active {
    color: #818CF8;
  }
  .nav-pill {
    width: 44px;
    height: 28px;
    border-radius: 14px;
    background: rgba(99, 102, 241, 0.18);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #818CF8;
    margin-bottom: 2px;
  }

</style>
</head>
<body>

<h1>声念 EchoMind · 界面精细化重构设计</h1>
<p class="sub">针对反馈：平衡充足的文字输入空间 + 精致紧凑的语音录制交互 + 保留底部导航栏</p>

<div class="showcase">
  <!-- 手机展示 -->
  <div class="phone">
    <!-- 状态栏 -->
    <div class="status-bar">
      <span>9:41</span>
      <span>5G · 85%</span>
    </div>

    <!-- 顶栏 -->
    <div class="app-header">
      <div class="brand">
        <div class="logo-icon">🎙️</div>
        <span class="brand-title">声念</span>
      </div>
      <div class="settings-btn">⚙️</div>
    </div>

    <!-- 模板切换胶囊 -->
    <div class="template-chips">
      <div class="chip active">💡 碎片想法</div>
      <div class="chip">🌙 每日复盘</div>
      <div class="chip">💼 会议纪要</div>
    </div>

    <!-- 主交互区 -->
    <div class="main-content">
      <!-- 优雅文本输入卡片（留足手写/打字空间） -->
      <div class="editor-card">
        <textarea class="editor-textarea" placeholder="把你想说或想写的话放在这里...&#10;• 支持直接键盘打字输入&#10;• 也可随时点击下方说话&#10;• AI 将按选中模板自动结构化整理"></textarea>
        <div class="editor-bottom">
          <div class="editor-tools">
            <span>🏷️ 标签</span>
            <span>📝 Markdown</span>
            <span>✨ 模板</span>
          </div>
          <span class="char-count">0 字</span>
        </div>
      </div>

      <!-- 紧凑精致的双模操作栏（录音按键不再过度侵占面积） -->
      <div class="action-bar-hybrid">
        <button class="btn-mic-compact">
          <div class="mic-wave-icon">🎙️</div>
          <span>按住 / 轻触说话</span>
        </button>
        <button class="btn-ai-clean">
          <span>✨ AI 整理</span>
        </button>
      </div>

      <!-- 最近记录卡片 -->
      <div class="recent-card">
        <div class="recent-info">
          <span class="recent-title">💡 优化 EchoMind 交互逻辑</span>
          <span class="recent-time">今天 16:42 · 3 项待办</span>
        </div>
        <span class="badge-synced">✓ Notion已同步</span>
      </div>
    </div>

    <!-- 底部导航栏（保留精致形态） -->
    <div class="bottom-nav">
      <div class="nav-item active">
        <div class="nav-pill">✏️</div>
        <span>记录</span>
      </div>
      <div class="nav-item">
        <div style="width: 44px; height: 28px; display: flex; align-items: center; justify-content: center; font-size: 16px;">📚</div>
        <span>外脑库</span>
      </div>
    </div>
  </div>
</div>

</body>
</html>
