<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <linearGradient id="e_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="240" rx="24" fill="#0F172A"/>
  
  <!-- Logo Mark (E-Wave) -->
  <g transform="translate(40, 20)">
    <!-- Vertical Spine -->
    <rect x="50" y="40" width="22" height="120" rx="11" fill="#6366F1"/>
    <!-- Top Wave Bar -->
    <rect x="50" y="40" width="105" height="20" rx="10" fill="#6366F1"/>
    <!-- Mid Wave Bar -->
    <rect x="50" y="90" width="75" height="20" rx="10" fill="#38BDF8"/>
    <!-- Bottom Wave Bar -->
    <rect x="50" y="140" width="120" height="20" rx="10" fill="#10B981"/>
    <!-- Pulse Dots -->
    <circle cx="175" cy="50" r="7" fill="#6366F1" opacity="0.9"/>
    <circle cx="145" cy="100" r="8" fill="#38BDF8" opacity="0.9"/>
    <circle cx="190" cy="150" r="8" fill="#10B981" opacity="0.9"/>
  </g>
  
  <!-- Divider -->
  <line x1="310" y1="50" x2="310" y2="190" stroke="#334155" stroke-width="2"/>
  
  <!-- Wordmark -->
  <text x="350" y="115" font-family="'Cal Sans', 'Segoe UI', sans-serif" font-size="56" font-weight="bold" fill="#FFFFFF" letter-spacing="1">EchoMind</text>
  <text x="352" y="158" font-family="'Segoe UI', sans-serif" font-size="20" fill="#10B981" letter-spacing="4">声 念 · VOICE TO NOTES</text>
</svg>
